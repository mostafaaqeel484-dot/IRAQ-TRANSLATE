name: AI Translate V0.15.2 Xiaomi-inspired Audio Mobile + MT5889 Build
on:
  push:
    branches: ['feature/xiaomi-inspired-live-audio-v0152-20261126']
    paths: ['v015/**', '.github/workflows/v015-runner.yml', 'settings.gradle.kts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 (preinstalled runner tools)
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble both versions
        run: gradle --no-daemon --stacktrace :v015:assembleMobileDebug :v015:assembleMt5889Debug
      - name: Verify two output packages
        run: |
          test -s v015/build/outputs/apk/mobile/debug/v015-mobile-debug.apk
          test -s v015/build/outputs/apk/mt5889/debug/v015-mt5889-debug.apk
          sha256sum v015/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Translate-V0152-Mobile-Xiaomi-Inspired-APK
          path: v015/build/outputs/apk/mobile/debug/v015-mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Translate-V0152-MT5889-Xiaomi-Inspired-APK
          path: v015/build/outputs/apk/mt5889/debug/v015-mt5889-debug.apk
          if-no-files-found: error
          retention-days: 30
